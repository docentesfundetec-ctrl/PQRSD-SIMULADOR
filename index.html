const MODES = {
 guided:{label:'Modo guiado',count:10,hints:true,description:'Aprende junto al docente, con pistas y retroalimentación en cada caso.'},
 practice:{label:'Modo práctica',count:15,hints:false,description:'Atiende a 15 personas por tu cuenta y descubre tu calificación al finalizar.'}
};
function casesForMode(mode){return CASES.slice(0,(MODES[mode]||MODES.guided).count);}
function gradeOnFive(percent){return Math.floor(Math.max(1,Math.min(5,Number(percent)/20))*100+1e-8)/100;}
function canSeeResults(session){return session.mode!=='practice'||session.results.length===MODES.practice.count;}
function canExportReport(session){return session.results.length>0&&canSeeResults(session);}

const RUBRIC = [
 {key:'type',label:'Clasificación PQRSD',max:15},
 {key:'area',label:'Área responsable',max:10},
 {key:'priority',label:'Prioridad proporcional',max:5},
 {key:'deadline',label:'Plazo de seguimiento',max:5},
 {key:'status',label:'Estado del expediente',max:5},
 {key:'action',label:'Acción de gestión',max:10},
 {key:'evidence',label:'Soportes pertinentes',max:5},
 {key:'email',label:'Contacto verificado',max:5},
 {key:'facts',label:'Registro de hechos',max:5},
 {key:'request',label:'Solicitud del cliente',max:5}
];
function normalize(value){return String(value||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function gradeBand(score){return score>=90?{label:'Sobresaliente',className:'excellent'}:score>=80?{label:'Competente',className:'good'}:score>=60?{label:'Aprobado',className:'pass'}:{label:'Por reforzar · No aprobado',className:'fail'};}
function evaluateCase(c,draft,answers){
 const checks=RUBRIC.map(r=>{
  let ok,expected;
  if(r.key==='action'){expected=c.actions[0];ok=draft.action===expected;}
  else if(r.key==='evidence'){expected=c.evidence.map(id=>c.docs.find(d=>d.id===id).name).join(' + ');ok=Array.isArray(draft.evidence)&&draft.evidence.length===c.evidence.length&&c.evidence.every(id=>draft.evidence.includes(id));}
  else if(r.key==='facts'){expected='Mínimo 25 caracteres en hechos. El docente revisa su contenido.';ok=String(draft.facts||'').trim().length>=25;}
  else if(r.key==='request'){expected='Mínimo 15 caracteres en la solicitud. El docente revisa su contenido.';ok=String(draft.request||'').trim().length>=15;}
  else {expected=c[r.key];ok=normalize(draft[r.key])===normalize(expected);}
  return {...r,earned:ok?r.max:0,expected};
 });
 const dialogue=c.steps.map((s,i)=>{const a=s.options[answers[i]];return {label:['Acogida','Verificación','Compromiso'][i],earned:a?a[1]:0,max:10,selected:a?a[0]:'Sin respuesta',feedback:a?a[2]:'No hay respuesta registrada.',expected:s.options.find(x=>x[1]===10)[0]};});
 const crm=checks.reduce((s,x)=>s+x.earned,0),dialogueScore=dialogue.reduce((s,x)=>s+x.earned,0);
 return {checks,dialogue,crm,dialogueScore,total:crm+dialogueScore};
}

 <script>/* Generador PDF mínimo y autónomo. Fuentes estándar PDF con codificación WinAnsi. */

 let content=[],y=0,section='Informe de aprendizaje',compact=false;

 function encoded(t){const map={'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159};let s='';for(const ch of plain(t)){const cp=ch.codePointAt(0);s+=cp<=255?ch:map[ch]?String.fromCharCode(map[ch]):'?';}return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[\r\n]/g,' ');}
 function width(t,size){let u=0;for(const ch of plain(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'')){if('ilI.,:;!\'|'.includes(ch))u+=.278;else if('frt()[]'.includes(ch))u+=.36;else if('mw'.includes(ch))u+=.84;else if('MW@%'.includes(ch))u+=.96;else if(ch===' ')u+=.278;else if(/[A-Z]/.test(ch))u+=.73;else if(/[0-9]/.test(ch))u+=.556;else u+=.56;}return u*size;}
 function wrap(t,size,maxWidth){const lines=[];for(const para of plain(t).split(/\r?\n/)){let line='';for(let word of para.split(/\s+/).filter(Boolean)){if(width(word,size)>maxWidth){if(line){lines.push(line);line='';}let part='';for(const ch of word){if(width(part+ch,size)>maxWidth){lines.push(part);part='';}part+=ch;}line=part;}else if(width(line?line+' '+word:word,size)>maxWidth){lines.push(line);line=word;}else line=line?line+' '+word:word;}lines.push(line);}return lines;}
 function rawText(t,x,yy,size=10,bold=false,color=ink){content.push(`${color.join(' ')} rg BT /${bold?'F2':'F1'} ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${yy.toFixed(2)} Tm (${encoded(t)}) Tj ET`);}
 function rect(x,yy,w,h,color){content.push(`${color.join(' ')} rg ${x.toFixed(2)} ${yy.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);}
 function finishPage(){if(!content.length)return;rect(M,42,usable,.5,[.84,.87,.81]);rawText('PUNTO DE ENCUENTRO | Práctica educativa de PQRSD',M,29,7,false,muted);rawText(String(pages.length+1),W-M-10,29,8,false,muted);pages.push(content.join('\n'));}
 function newPage(){finishPage();content=[];rect(M,H-57,17,17,green);rawText('PE',M+2,H-52,8,true,[1,1,1]);rawText('PUNTO DE ENCUENTRO',M+25,H-45,9,true,green);rawText(section,M+25,H-57,7,false,muted);rect(M,H-70,usable,.6,[.84,.87,.81]);y=H-96;}
 function ensure(h){if(y-h<59)newPage();}
 function text(t,{size=9,bold=false,color=ink,gap=4,indent=0}={}){const lineH=size*(compact?1.25:1.4),lines=wrap(t,size,usable-indent);for(const line of lines){ensure(lineH);rawText(line,M+indent,y,size,bold,color);y-=lineH;}y-=gap;}

 function pair(label,value){ensure(32);text(label.toUpperCase(),{size:7,bold:true,color:muted,gap:1});text(value||'No registrado',{size:9,gap:compact?3:7});}
 function row(label,value,color=ink){ensure(20);rawText(label,M,y,8.5,false,color);rawText(value,W-M-width(value,8.5)-4,y,8.5,true,color);y-=compact?14:18;}
 const config=MODES[session.mode]||MODES.guided,n=session.results.length,total=session.results.reduce((s,r)=>s+r.total,0),avg=n?total/n:0,complete=n===config.count,band=gradeBand(avg);
 const scorePalette={fail:[[.65,.27,.23],[.97,.89,.85]],pass:[[.47,.36,.13],[.97,.93,.80]],good:[[.13,.38,.29],[.87,.94,.89]],excellent:[[.28,.40,.18],[.91,.94,.85]]}[band.className];
 const grade=new Intl.NumberFormat('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(gradeOnFive(avg));

 newPage();text(complete?'RESULTADO DE LA JORNADA':'INFORME PARCIAL DE LA JORNADA',{size:9,bold:true,color:muted,gap:10});text('Escuchar. Comprender. Gestionar.',{size:24,bold:true,color:green,gap:17});
 pair('Estudiante',session.student.name);pair('Curso o grupo',session.student.group||'No indicado');text(`${config.label} | ${config.count} clientes | ${session.mode==='practice'?'Sin pistas':'Con acompañamiento y pistas'}`,{size:9,bold:true,color:green,gap:9});pair('Emisión del informe',date(new Date().toISOString())+' (Colombia)');
 ensure(75);rect(M,y-58,usable,69,scorePalette[1]);rawText(grade,M+15,y-29,31,true,scorePalette[0]);rawText('/ 5',M+100,y-29,14,false,scorePalette[0]);rawText(`${band.label}${complete?'':' (provisional)'}`,M+145,y-9,11,true,green);rawText(`${total} / ${n*100} puntos evaluados | ${n} / ${config.count} casos`,M+145,y-29,9,false,ink);rawText(`${number(avg)}% | Aprobación desde 3,00 (60%).`,M+145,y-44,8,false,muted);y-=82;
 if(!complete)text('Informe parcial: este promedio considera únicamente los casos evaluados. No representa la calificación final de la jornada.',{size:9,bold:true,color:[.62,.39,.20],gap:10});
 heading('Resumen por cliente');
 compact=true;session.results.forEach(r=>{const c=CASES.find(c=>c.id===r.id);row(`${r.id}  ${c.name} | ${c.type}`,`${r.total} / 100`,r.total>=60?green:[.66,.29,.25]);});compact=false;
 heading('Cómo se calcula la calificación');
 text(`Cada caso: 30 puntos de conversación + 70 de CRM. Porcentaje global: puntos sobre ${config.count*100}, multiplicados por 100. Nota de 1 a 5: porcentaje dividido entre 20, con mínimo 1,00. Se muestran dos decimales sin redondear hacia arriba.`,{size:8.5});
 text('1,00-2,99: No aprobado | 3,00-3,99: Aprobado | 4,00-4,49: Competente | 4,50-5,00: Sobresaliente.',{size:8});
 text('Las notas de hechos y solicitud se puntúan por extensión (25 y 15 caracteres). Su precisión y pertinencia requieren revisión del docente. Este informe registra una práctica local y no certifica identidad ni es una evaluación protegida contra modificaciones.',{size:8,color:muted});
 text('Todos los clientes son ficticios. Los plazos utilizados son acuerdos didácticos de seguimiento; no representan términos legales. No se enviaron correos ni se realizaron trámites reales.',{size:8,color:muted});
 for(const r of session.results){
  const c=CASES.find(c=>c.id===r.id);compact=true;section=`Expediente PE-${r.id} | ${session.student.name}`;newPage();
  text(`${r.id} | ${c.title}`,{size:19,bold:true,color:green,gap:8});text(`${c.name} | ${r.total}/100 puntos | ${gradeBand(r.total).label}`,{size:10,bold:true,gap:10});
  text(`Radicado: PE-${r.id} | ${date(r.timestamp)}`,{size:8,color:muted,gap:9});
  heading('Lo que registró el estudiante');

  pair('Hechos',r.draft.facts);pair('Solicitud del cliente',r.draft.request);pair('Acción de gestión',r.draft.action);
  pair('Soportes vinculados',(r.draft.evidence||[]).map(id=>c.docs.find(d=>d.id===id)?.name||id).join(', ')||'Ninguno');
  if(r.draft.followup)pair('Nota de seguimiento',r.draft.followup);

  heading(`Decisiones de diálogo | ${r.dialogueScore}/30 puntos`);
  for(const d of r.dialogue){text(`${d.label}: ${d.earned}/${d.max} puntos`,{size:9,bold:true,gap:2});text(`Respuesta: ${d.selected}`,{size:8.5,gap:2});text(`Retroalimentación: ${d.feedback}`,{size:8,color:muted,gap:5});if(d.earned<d.max)text(`Mejor opción: ${d.expected}`,{size:8,color:green,gap:8});}
  const rubricHeight=38+r.checks.reduce((sum,ch)=>sum+14+(ch.earned?0:wrap(`Criterio esperado: ${ch.expected}`,8,usable).length*10+6),0);

 const objects=[];objects[0]='<< /Type /Catalog /Pages 2 0 R >>';objects[1]=`<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_,i)=>`${5+i*2} 0 R`).join(' ')}] >>`;objects[2]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';objects[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
 pages.forEach((stream,i)=>{const pageId=5+i*2;objects[pageId-1]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${pageId+1} 0 R >>`;objects[pageId]=`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;});

 <script>function modeConfig(){return MODES[state.mode]||MODES.guided;}
function sessionCases(){return casesForMode(state.mode);}
function isGuided(){return state.mode==='guided';}
function resultsVisible(){return canSeeResults(state);}
function exportAvailable(){return canExportReport(state);}
function finalCase(){return state.index===modeConfig().count-1;}
function gradeText(percent){return new Intl.NumberFormat('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2}).format(gradeOnFive(percent));}
function storageKey(mode=state.mode){return STORAGE_KEY+'-'+mode;}
function readMode(mode){
 try{
  let raw=localStorage.getItem(storageKey(mode));
  if(!raw&&mode==='guided')raw=localStorage.getItem('punto-encuentro-pqrsd-v1');
  if(!raw)return blankState(mode);
  let data=JSON.parse(raw);
  if(data.version===1&&mode==='guided')data={...data,version:2,mode:'guided'};
  const list=casesForMode(mode);
  if(data.version!==2||data.mode!==mode||!data.student||typeof data.student.name!=='string'||typeof data.student.group!=='string'||!Number.isInteger(data.index)||data.index<0||data.index>list.length||!Array.isArray(data.results)||!Array.isArray(data.answers)||data.answers.length>3||!Number.isInteger(data.step)||data.step<0||data.step>3||data.step>data.answers.length)throw Error('Sesión inválida');
  if(data.results.length>list.length||!data.results.every((r,i)=>r.id===list[i].id&&r.draft&&Array.isArray(r.draft.evidence)&&Array.isArray(r.answers)&&r.answers.length===3&&r.answers.every(n=>Number.isInteger(n)&&n>=0&&n<3)))throw Error('Resultados inválidos');
  if(!(data.index===data.results.length||data.index===data.results.length-1)||!data.answers.every(n=>Number.isInteger(n)&&n>=0&&n<3))throw Error('Turno inválido');
  const restored={...blankState(mode),...data,draft:{...blankDraft(),...data.draft},readDocs:Array.isArray(data.readDocs)?data.readDocs:[]};
  if(!Array.isArray(restored.draft.evidence))restored.draft.evidence=[];
  restored.results=restored.results.map(r=>({...r,...evaluateCase(list.find(c=>c.id===r.id),r.draft,r.answers)}));
  return restored;
 }catch(e){toast('No se pudo recuperar esa jornada. Puedes iniciar una nueva en este modo.');return blankState(mode);}
}

function renderPracticeInstructions(){return `<div class="view-heading"><div><div class="eyebrow">MODO PRÁCTICA · SIN PISTAS</div><h1>Así funciona tu jornada.</h1><p>Atiende a los 15 clientes antes de consultar la calificación global.</p></div><button class="button secondary" data-view="desk">Volver al mostrador${icon('arrow')}</button></div><section class="panel manual-card"><h2>Tu recorrido</h2><ol class="protocol-list"><li>Lee la conversación y consulta los datos y documentos del cliente.</li><li>Elige una respuesta en cada uno de los tres momentos de atención.</li><li>Completa Registro, Gestión y Seguimiento en el CRM.</li><li>Radica el expediente y continúa con el siguiente cliente.</li><li>Al terminar los 15 casos, revisa tu nota de 1 a 5 y descarga el PDF.</li></ol><p>Las decisiones quedan registradas y no se modifican después de radicar. La evaluación, las respuestas esperadas y el PDF se habilitan al completar la jornada. No hay pistas, protocolo de solución ni correcciones durante el recorrido.</p><p style="margin-top:12px">La ficha, los documentos del cliente y tu libreta permanecen disponibles: son tus materiales de trabajo.</p></section><section class="panel manual-card"><h2>Tu calificación</h2><p>Cada caso vale 100 puntos: 30 de diálogo y 70 de CRM. Total de la práctica: 1.500 puntos. El porcentaje global se convierte a la escala de 1 a 5 dividiéndolo entre 20, con nota mínima 1,00. Se aprueba desde 60% (3,00). La nota se presenta con dos decimales sin redondearla hacia arriba.</p><p style="margin-top:12px">Los campos de hechos y solicitud se puntúan por extensión mínima (25 y 15 caracteres). El docente revisa la calidad de lo escrito. Los plazos son reglas de la simulación, no términos legales.</p></section>${gradeLegend()}`;}

function renderDialogue(c){
 const result=currentResult();
 if(result)return `<div class="turn-done">${icon('check')}<h3>Expediente radicado</h3><p>${resultsVisible()?`Obtuviste ${result.total} de 100 puntos. Revisa la retroalimentación antes de continuar.`:'Tus decisiones están registradas. La evaluación estará disponible al finalizar los 15 clientes.'}</p><div class="button-row" style="justify-content:center">${resultsVisible()?`<button class="button secondary" data-review="${c.id}">Ver evaluación</button>`:''}<button class="button" data-action="next-case">${finalCase()?'Ver resultado final':'Siguiente cliente'}${icon('arrow')}</button></div></div>`;
 if(state.step===3)return `<div class="dialogue"><blockquote class="speech">${esc(c.steps[2].reply)}</blockquote><div class="feedback neutral"><strong>Conversación completada${isGuided()?' · '+state.answers.reduce((s,n,i)=>s+c.steps[i].options[n][1],0)+' / 30 puntos':''}</strong>Ahora completa el expediente y radica el caso.</div><button class="button secondary mobile-guide" style="width:100%;margin-top:14px" data-pane="crm">Continuar al CRM →</button><details class="dialogue-transcript"><summary>Revisar la conversación</summary>${c.steps.map((s,i)=>`<p><b>Tú:</b> ${esc(s.options[state.answers[i]][0])}<br><b>${esc(c.name)}:</b> ${esc(s.reply)}</p>`).join('')}</details></div>`;
 const i=state.step,step=c.steps[i],selected=state.answers[i],answered=selected!==undefined,quote=i===0?c.intro:c.steps[i-1].reply;
 return `<div class="dialogue"><blockquote class="speech">${esc(quote)}</blockquote><div class="step-meta"><span class="eyebrow" style="font-size:8px;letter-spacing:1.25px">${['01 · ACOGER','02 · VERIFICAR','03 · COMPROMETERSE'][i]}</span><div class="step-dots" aria-label="Paso ${i+1} de 3">${[0,1,2].map(n=>`<span class="${n<i?'done':n===i?'current':''}"></span>`).join('')}</div></div><div class="prompt">${esc(step.prompt)}</div>${!answered?hintBox(c):''}<div class="choices">${rotate([0,1,2],(state.index*2+i)%3).map((n,position)=>`<button class="choice ${selected===n?'selected '+(isGuided()&&step.options[n][1]<10?'wrong':''):''}" data-choice="${n}" ${answered?'disabled':''}><span class="choice-key">${position+1}</span><span>${esc(step.options[n][0])}</span></button>`).join('')}</div>${answered?`<div class="feedback ${isGuided()?(step.options[selected][1]<10?'warn':''):'neutral'}" role="status"><strong>${isGuided()?`+${step.options[selected][1]} / 10 puntos · ${step.options[selected][1]===10?'Buena decisión':'Una oportunidad de mejorar'}`:'Respuesta registrada'}</strong>${isGuided()?esc(step.options[selected][2]):'Continúa la atención. Recibirás la evaluación al finalizar tu práctica.'}<button class="button" data-action="next-dialogue">${i===2?'Preparar el expediente':'Continuar conversación'}${icon('arrow')}</button></div>`:'<p class="tiny-note">Elige una respuesta. En computador también puedes usar 1, 2 o 3.</p>'}</div>`;
}
function renderCompletedCRM(c){const r=currentResult();return `<section class="panel crm-panel" aria-label="CRM del caso"><div class="crm-header"><div class="crm-title"><div>${icon('folder')}</div><h3>CRM · Expediente radicado</h3></div><span class="case-number mono">PE-${c.id}</span></div><div class="crm-body">${resultsVisible()?`${resultsVisible()?`<span class="grade ${gradeBand(r.total).className}">${r.total}% · ${gradeBand(r.total).label}</span>`:'<span class="badge blue">REGISTRADO</span>'}`:'<span class="badge blue">REGISTRO COMPLETADO</span>'}${recordSummary(r,c)}${resultsVisible()?`<button class="button secondary" data-review="${c.id}" style="width:100%">${icon('chart')}Ver retroalimentación completa</button>`:''}<button class="button" data-action="next-case" style="width:100%;margin-top:12px">${finalCase()?'Ver resultado final':'Siguiente cliente'}${icon('arrow')}</button></div></section>`;}

function renderCRM(c){
 if(currentResult())return renderCompletedCRM(c);
 const d=state.draft;
 return `<section class="panel crm-panel" aria-label="CRM del caso"><div class="crm-header"><div class="crm-title"><div>${icon('folder')}</div><section><h3>CRM · Nuevo expediente</h3><p class="crm-subtitle">Convierte una conversación en una solución.</p></section></div><span class="case-number mono">PE-${c.id}</span></div><div class="crm-tabs" role="tablist" aria-label="Secciones del expediente">${['Registro','Gestión','Seguimiento'].map((t,i)=>`<button id="crm-tab-${i}" type="button" role="tab" aria-selected="${crmTab===i}" aria-controls="crm-section-${i}" tabindex="${crmTab===i?0:-1}" class="crm-tab ${crmTab===i?'active':''}" data-crm-tab="${i}"><span>${i+1}</span>${t}</button>`).join('')}</div><form id="crm-form" novalidate><div class="crm-body">
 <section role="tabpanel" id="crm-section-0" aria-labelledby="crm-tab-0" ${crmTab!==0?'hidden':''}><h4 class="form-heading" style="margin-top:0">Primero, entiende el caso.</h4><p class="form-desc">Consulta la ficha y los documentos. Los campos con * son obligatorios.</p><div class="form-row"><div class="field"><label for="crm-name">Nombre del cliente</label><input class="input" id="crm-name" value="${esc(c.name)}" readonly></div><div class="field"><label for="crm-channel">Canal de ingreso</label><input class="input" id="crm-channel" value="Presencial" readonly></div></div><div class="field"><div class="contact-header"><label for="crm-email">Correo de respuesta <span class="required-star">*</span></label><button type="button" class="link-button" data-action="dossier">Consultar ficha</button></div><input class="input" type="email" id="crm-email" name="email" required maxlength="100" autocomplete="off" placeholder="Transcribe el correo confirmado" value="${esc(d.email)}"></div><div class="field"><label for="crm-type">Tipo de solicitud PQRSD <span class="required-star">*</span></label><select id="crm-type" name="type" required>${optionHTML(TYPES,d.type,'¿Cómo clasificarías este caso?')}</select></div><div class="field"><label for="crm-facts">Hechos del caso <span class="required-star">*</span></label><textarea id="crm-facts" name="facts" maxlength="1200" required placeholder="¿Qué ocurrió? Incluye la referencia y los hechos verificables.">${esc(d.facts)}</textarea><small>5 puntos por registrar al menos 25 caracteres. El contenido lo revisa tu docente.</small></div><div class="field"><label for="crm-request">¿Qué solicita el cliente? <span class="required-star">*</span></label><textarea id="crm-request" name="request" maxlength="700" required placeholder="Describe el resultado que espera el cliente.">${esc(d.request)}</textarea><small>5 puntos por registrar al menos 15 caracteres. Usa tus propias palabras.</small></div><div class="tab-advance"><button type="button" class="button secondary" data-crm-tab="1">Definir gestión${icon('arrow')}</button></div></section>
 <section role="tabpanel" id="crm-section-1" aria-labelledby="crm-tab-1" ${crmTab!==1?'hidden':''}><h4 class="form-heading" style="margin-top:0">Asigna una ruta clara.</h4><p class="form-desc">Elige el área y las acciones que corresponden a los hechos.</p><div class="field"><label for="crm-area">Área responsable <span class="required-star">*</span></label><select id="crm-area" name="area" required>${optionHTML(AREAS,d.area)}</select></div><div class="form-row"><div class="field"><label for="crm-priority">Prioridad <span class="required-star">*</span></label><select id="crm-priority" name="priority" required>${optionHTML(PRIORITIES,d.priority)}</select></div><div class="field"><label for="crm-status">Estado del caso <span class="required-star">*</span></label><select id="crm-status" name="status" required>${optionHTML(STATUSES,d.status)}</select></div></div><div class="field"><label for="crm-action">Acción de gestión <span class="required-star">*</span></label><select id="crm-action" name="action" required>${optionHTML(rotate(c.actions,state.index%3),d.action)}</select><small id="action-preview" class="selection-preview" ${d.action?'':'hidden'}>${esc(d.action)}</small><small>La acción queda registrada como una gestión simulada.</small></div><fieldset class="field"><legend>Soportes que vincularás al expediente</legend>${c.docs.map(doc=>`<label class="check-item"><input type="checkbox" name="evidence" value="${doc.id}" ${d.evidence.includes(doc.id)?'checked':''}><span>${esc(doc.name)}<small>${doc.kind.toLowerCase()}</small></span></label>`).join('')}<small>Selecciona todos los soportes pertinentes. Incluir documentos ajenos al caso no suma puntos.</small></fieldset>${isGuided()?`<div class="callout">${icon('info')}<span>El estado debe reflejar lo ocurrido: radicar no significa resolver. Consulta las pistas del CRM cuando lo necesites.</span></div>`:''}<div class="tab-advance"><button type="button" class="button secondary" data-crm-tab="2">Preparar seguimiento${icon('arrow')}</button></div></section>
 <section role="tabpanel" id="crm-section-2" aria-labelledby="crm-tab-2" ${crmTab!==2?'hidden':''}><h4 class="form-heading" style="margin-top:0">Deja un compromiso verificable.</h4><p class="form-desc">La atención continúa después de la conversación.</p><div class="field"><label for="crm-deadline">Plazo de seguimiento <span class="required-star">*</span></label><select id="crm-deadline" name="deadline" required>${optionHTML(DEADLINES,d.deadline)}</select><small>Acuerdo de esta práctica; no representa un término legal.</small></div><div class="field"><label for="crm-followup">Nota de seguimiento (opcional)</label><textarea class="large" id="crm-followup" name="followup" maxlength="1200" placeholder="¿Quién continuará la gestión? ¿Qué verificarás y cómo comunicarás el avance?">${esc(d.followup)}</textarea><small>Se conserva en el expediente y en el PDF para revisión del docente.</small></div><div class="callout">${icon('shield')}<span>Antes de radicar: verifica los datos, la clasificación, los soportes y el compromiso. Tu primera entrega define la puntuación del caso.</span></div>${isGuided()?`<button type="button" class="tool-btn" data-action="protocol">${icon('book')}Consultar pistas del CRM</button>`:''}<p class="tiny-note">Se genera un radicado educativo. No se envían correos ni se tramitan solicitudes reales.</p></section>
 </div><div class="crm-footer"><button type="submit" class="button" ${state.step<3?'disabled':''}>${icon('check')}Radicar y evaluar el caso${icon('arrow')}</button><small>${state.step<3?'Completa las tres decisiones de diálogo para radicar.':'30 puntos de diálogo + 70 puntos de gestión en CRM.'}</small></div></form></section>`;
}
function setCRMTab(index){crmTab=index;document.querySelectorAll('[role="tab"][data-crm-tab]').forEach(b=>{const active=Number(b.dataset.crmTab)===index;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});for(let i=0;i<3;i++){const section=$('#crm-section-'+i);if(section)section.hidden=i!==index;}const el=$('#crm-tab-'+index);if(el)el.focus({preventScroll:true});}
function setPane(pane){mobilePane=pane;const workspace=$('.workspace');if(workspace)workspace.dataset.mobile=pane;document.querySelectorAll('.mobile-switch button').forEach(b=>{const active=b.dataset.pane===pane;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});if(innerWidth<=740&&workspace)workspace.scrollIntoView({block:'start',behavior:'instant'});}
function choose(n){if(transitioning)return;if(!state.student.name){openWelcome();return;}if(!currentCase()||currentResult()||state.step>2||state.answers[state.step]!==undefined)return;state.answers[state.step]=n;save();sound(!isGuided()||currentCase().steps[state.step].options[n][1]===10);const scroll=window.scrollY;render();window.scrollTo(0,scroll);$('[data-action="next-dialogue"]')?.focus({preventScroll:true});}
function nextDialogue(){if(state.answers[state.step]===undefined)return;state.step++;save();const scroll=window.scrollY;render();window.scrollTo(0,scroll);if(state.step===3)announce('Conversación completada. Ya puedes radicar en el CRM.');else $('.choice')?.focus({preventScroll:true});}
function submitCRM(){
 if(transitioning||state.step!==3||currentResult()||!currentCase())return;
 const required=['email','type','facts','request','area','priority','status','action','deadline'];
 for(const name of required){const el=$('[name="'+name+'"]');if(!el.checkValidity()||!el.value.trim()){setPane('crm');setCRMTab(['email','type','facts','request'].includes(name)?0:name==='deadline'?2:1);el.focus();el.reportValidity();toast('Completa los campos obligatorios antes de radicar.');return;}}
 const c=currentCase(),result={id:c.id,draft:JSON.parse(JSON.stringify(state.draft)),answers:[...state.answers],timestamp:new Date().toISOString(),...evaluateCase(c,state.draft,state.answers)};
 state.results.push(result);save();sound(!isGuided()||result.total>=60);render();if(isGuided()){openResult(result.id,true);announce('Caso radicado. Resultado: '+result.total+' de 100 puntos.');}else{openReceipt();announce('Expediente registrado. '+state.results.length+' de 15 clientes atendidos.');}
}
async function nextCase(){if(transitioning||!currentResult())return;closeModal();transitioning=true;$('#main').inert=true;const overlay=$('#transition-screen');try{if(!reducedMotion()){mobilePane='desk';render();$('.client-motion')?.classList.add('client-exit');overlay.innerHTML=`<div class="transition-ticket compact"><span class="transition-icon">${icon(finalCase()?'star':'users')}</span><div class="eyebrow">${finalCase()?'JORNADA COMPLETADA':'SIGUIENTE TURNO'}</div><h2>${finalCase()?'Tu resultado está listo.':esc(sessionCases()[state.index+1].name)}</h2><p>${finalCase()?'Preparando tu calificación global…':'Una nueva historia espera en el mostrador.'}</p><div class="transition-track"><span></span></div></div>`;overlay.hidden=false;await sleepAnimation(700);}state.index++;state.answers=[];state.step=0;state.draft=blankDraft();state.readDocs=[];crmTab=0;mobilePane='desk';save();if(state.index===modeConfig().count){view='progress';sound(true);}render();window.scrollTo({top:0,behavior:'instant'});}finally{overlay.hidden=true;$('#main').inert=false;transitioning=false;}animateArrival();$('#main').focus({preventScroll:true});}

function recordSummary(r,c){return `<dl class="data-summary"><dt>Cliente y contacto</dt><dd>${esc(c.name)} · ${esc(r.draft.email)}</dd><dt>Clasificación registrada</dt><dd>${esc(r.draft.type)} · ${esc(r.draft.priority)} · ${esc(r.draft.area)}</dd><dt>Estado y seguimiento</dt><dd>${esc(r.draft.status)} · ${esc(r.draft.deadline)}</dd><dt>Hechos registrados</dt><dd>${esc(r.draft.facts)}</dd><dt>Solicitud del cliente</dt><dd>${esc(r.draft.request)}</dd><dt>Acción de gestión</dt><dd>${esc(r.draft.action)}</dd><dt>Soportes asociados</dt><dd>${esc((r.draft.evidence||[]).map(id=>c.docs.find(d=>d.id===id)?.name||id).join(', ')||'Ninguno')}</dd>${r.draft.followup?`<dt>Nota de seguimiento</dt><dd>${esc(r.draft.followup)}</dd>`:''}<dt>Radicado en la simulación</dt><dd>PE-${c.id} · ${esc(dateText(r.timestamp))}</dd></dl>`;}
function renderRecords(){return `<div class="view-heading"><div><div class="eyebrow">TRAZABILIDAD DE TU ATENCIÓN</div><h1>Un caso, una historia.</h1><p>Consulta los expedientes que has radicado durante esta jornada.</p></div><button class="button secondary" data-action="export" ${!exportAvailable()?'disabled':''}>${icon('download')}Descargar informe PDF</button></div><div class="record-tools"><label class="sr-only" for="record-search">Buscar expediente</label><input class="input" id="record-search" type="search" placeholder="Buscar cliente, radicado o caso…"><label class="sr-only" for="record-filter">Filtrar por categoría</label><select id="record-filter">${optionHTML(TYPES,'','Todas las categorías')}</select></div><div id="records-list">${recordCards()}</div>`;}
function recordCards(query='',type=''){const records=state.results.filter(r=>{const c=CASES.find(c=>c.id===r.id);return (!type||r.draft.type===type)&&normalize(c.name+' '+c.title+' PE-'+c.id).includes(normalize(query));});if(!records.length)return `<div class="panel empty">${icon('folder')}<h2>${state.results.length?'No encontramos coincidencias.':'Tu primer expediente empieza en el mostrador.'}</h2><p>${state.results.length?'Prueba con otro nombre, radicado o categoría.':'Escucha al cliente, prepara el CRM y radica el caso. Aquí quedará su trazabilidad.'}</p>${state.results.length?'':'<button class="button" data-view="desk">Ir al mostrador →</button>'}</div>`;return `<div class="record-grid">${records.map(r=>{const c=CASES.find(c=>c.id===r.id),band=gradeBand(r.total);return `<article class="panel record"><div class="record-top"><span class="eyebrow" style="font-size:9px">PE-${r.id}</span>${resultsVisible()?`<span class="grade ${band.className}">${r.total}%</span>`:'<span class="badge blue">Registrado</span>'}</div><h3>${esc(c.title)}</h3><p>${esc(c.name)} · ${esc(dateText(r.timestamp))}</p><div class="record-meta"><span class="badge">${esc(r.draft.type)}</span><span class="badge blue">${esc(r.draft.status)}</span></div><div class="record-bottom"><span>${esc(r.draft.area)}</span><button class="button secondary" data-record="${r.id}">Abrir expediente${icon('arrow')}</button></div></article>`;}).join('')}</div>`;}
function renderProgress(){
 const n=state.results.length,p=average(),count=modeConfig().count,complete=n===count,visible=resultsVisible(),band=gradeBand(p);
 return `<div class="view-heading"><div><div class="eyebrow">${modeConfig().label.toUpperCase()} · TU APRENDIZAJE</div><h1>${complete?'Jornada completada.':'Cada atención te hace mejor.'}</h1><p>${complete?`${count} historias atendidas. Tu resultado global está listo.`:isGuided()?'Revisa tus decisiones junto al docente mientras avanzas.':'Completa los 15 clientes para consultar tu calificación y descargar el PDF.'}</p></div><div class="button-row"><button class="button ghost" data-action="profile">${icon('users')}${esc(state.student.name)}</button><button class="button secondary" data-action="modes">Cambiar modo</button></div></div>${complete?`<div class="complete-banner"><div><div class="eyebrow" style="color:#b7cda2">MISIÓN CUMPLIDA · ${count} / ${count} CASOS</div><h2>${p>=60?'Escuchaste, comprendiste y gestionaste.':'Una jornada para aprender y volver a intentar.'}</h2><p>${p>=60?'Alcanzaste la nota mínima de 3,00 sobre 5.':'Revisa la retroalimentación antes de comenzar una nueva jornada.'}</p></div><button class="button" data-action="export">${icon('download')}Descargar resultado PDF</button></div>`:''}
 <div class="progress-layout"><section class="panel overall-card"><div class="eyebrow">${complete?'CALIFICACIÓN FINAL':visible?'PROMEDIO GUIADO · PROVISIONAL':'AVANCE DE TU PRÁCTICA'}</div><div class="score-circle" style="--score:${visible&&n?p:n/count*100};margin-top:23px;${visible&&n&&p<60?'--green:#ad6251':''}"><div><strong>${visible&&n?gradeText(p):n}</strong><span>${visible&&n?'/ 5,00':`de ${count} clientes`}</span></div></div>${visible&&n?`<span class="grade ${band.className}">${band.label}${!complete?' · provisional':''}</span><p><b>${totalPoints()} / ${n*100} puntos · ${scoreText(p)}%</b></p>`:'<span class="badge blue">CALIFICACIÓN AL FINALIZAR</span>'}<h2 style="margin-top:18px">${n} de ${count} historias atendidas</h2><p>Escala de 1 a 5. Se aprueba desde 3,00, equivalente al 60%. Cada caso vale 100 puntos.</p><button class="button" data-action="export" ${exportAvailable()?'':'disabled'}>${icon('download')}${complete?'Descargar resultado PDF':isGuided()?'Descargar informe parcial':'PDF disponible al completar 15 casos'}</button>${!complete?'<button class="button secondary" data-view="desk">Volver al mostrador →</button>':''}<button class="button ghost" data-action="restart" style="margin-top:12px">${icon('restart')}Nueva jornada en este modo</button><p class="tiny-note">Las notas escritas requieren revisión del docente. El progreso de cada modo se conserva por separado.</p></section><section class="panel progress-details"><h3>${visible?'Así va tu atención':'Tu recorrido de atención'}</h3>${visible?[{label:'Diálogo y atención',key:'dialogueScore',max:30},{label:'Registro y gestión en CRM',key:'crm',max:70}].map(cat=>{const value=state.results.reduce((s,r)=>s+r[cat.key],0),max=cat.max*n;return `<div class="dimension"><div class="dimension-title"><span>${cat.label}</span><b class="mono">${value} / ${max}</b></div><div class="dimension-bar"><span style="width:${max?value/max*100:0}%"></span></div></div>`;}).join(''):'<p class="small muted">Durante la práctica verás qué expedientes has registrado. Las correcciones y puntuaciones se revelan al terminar.</p>'}<div class="progress-list">${sessionCases().map(c=>{const r=state.results.find(r=>r.id===c.id);return `<div class="progress-item"><span class="mono">${c.id}</span><div><strong>${esc(c.title)}</strong><small>${esc(c.name)}</small></div>${r?(visible?`<button class="grade ${gradeBand(r.total).className}" data-review="${c.id}" aria-label="Ver evaluación de ${esc(c.name)}: ${r.total} por ciento">${r.total}% ↗</button>`:'<span class="badge blue">Registrado</span>'):'<span class="small muted" style="font-size:9px">Pendiente</span>'}</div>`;}).join('')}</div></section></div>${gradeLegend()}`;
}

function gradeLegend(){return `<div class="legend" aria-label="Escala de calificación de 1 a 5"><div class="fail"><strong>1,00–2,99</strong>No aprobado</div><div class="pass"><strong>3,00–3,99</strong>Aprobado</div><div class="good"><strong>4,00–4,49</strong>Competente</div><div class="excellent"><strong>4,50–5,00</strong>Sobresaliente</div></div>`;}

function renderManual(){return isGuided()?renderGuidedManual():renderPracticeInstructions();}
function renderGuidedManual(){return `<div class="view-heading"><div><div class="eyebrow">CONSULTAR TAMBIÉN ES UNA BUENA DECISIÓN</div><h1>El manual de tu jornada.</h1><p>Puedes volver aquí durante cualquier caso. Usar el manual no resta puntos.</p></div><button class="button secondary" data-view="desk">Volver al mostrador${icon('arrow')}</button></div><div class="manual-layout"><div><section class="panel manual-card"><div class="eyebrow">CLASIFICAR CON CRITERIO</div><h2>Cinco formas de escuchar.</h2>${[['P','Petición','Solicitud de información, documentos o una actuación. Ejemplo: pedir un certificado.'],['Q','Queja','Inconformidad por el trato, la conducta o la atención recibida. Ejemplo: una llamada cortada sin orientación.'],['R','Reclamo','Inconformidad con el producto, el servicio o un cobro, cuya corrección se solicita. Ejemplo: una factura duplicada.'],['S','Sugerencia','Propuesta para mejorar la atención, un proceso o un servicio. Ejemplo: un canal más accesible.'],['D','Denuncia','Reporte de una posible irregularidad que debe revisar el área competente. Se registran hechos, sin prejuzgar.']].map(([letter,title,desc])=>`<div class="category-row"><span>${letter}</span><div><h3>${title}</h3><p>${desc}</p></div></div>`).join('')}<div class="callout">${icon('info')}<span>Una consulta informativa se trabaja como petición en esta práctica. Si surgen necesidades distintas, se deben separar las gestiones.</span></div></section><section class="panel manual-card"><div class="eyebrow">EL PROTOCOLO DE ESTA PRÁCTICA</div><h2>Del primer saludo al seguimiento.</h2><ol class="protocol-list"><li><b>Acoge:</b> escucha y reconoce la emoción sin minimizarla.</li><li><b>Verifica:</b> confirma hechos, referencias, soportes y contacto.</li><li><b>Registra:</b> distingue hechos de opiniones y define la solicitud.</li><li><b>Gestiona:</b> asigna el área, la prioridad, los soportes y una acción viable.</li><li><b>Comprométete:</b> informa el radicado y un seguimiento verificable.</li></ol><p>Una denuncia se maneja con reserva. No solicites contraseñas ni datos que no sean necesarios. No prometas sanciones, devoluciones o soluciones sin autorización.</p></section></div><div><section class="panel manual-card"><div class="eyebrow">ACUERDOS SIMULADOS</div><h2>¿A quién y para cuándo?</h2><p>Estos plazos son reglas didácticas de la jornada, no términos legales.</p>${[['Cobros duplicados','Facturación · Media · 3 días hábiles.'],['Trato e impuntualidad','Servicio al cliente · Media · 3 días hábiles.'],['Daños de producto','Soporte técnico · Media · 3 días hábiles.'],['Copias y certificados','Gestión documental · Media · 3 días hábiles.'],['Ideas y accesibilidad','Mejora continua · Baja · 5 días hábiles.'],['Posibles irregularidades y divulgación de datos','Ética y cumplimiento · Alta · 1 día hábil. Estado: Escalado.']].map(([name,desc])=>`<details><summary>${name}</summary><p>${desc}</p></details>`).join('')}<div class="callout">${icon('folder')}<span><b>Nuevo:</b> aún sin gestión. <b>En gestión:</b> asignado y con actividades pendientes. <b>Escalado:</b> remitido a revisión especializada. <b>Resuelto:</b> solución entregada y recepción confirmada. Los estados son parte de esta simulación.</span></div></section><section class="panel manual-card"><div class="eyebrow">RÚBRICA TRANSPARENTE</div><h2>100 puntos por caso.</h2><div class="rubric-row"><span>Tres decisiones de diálogo</span><b>30 pts</b></div>${RUBRIC.map(r=>`<div class="rubric-row"><span>${r.label}</span><b>${r.max} pts</b></div>`).join('')}<p style="margin-top:15px">Las opciones de diálogo pueden dar 0, 2, 3, 4 o 10 puntos. Los campos estructurados del CRM dan el valor completo si coinciden con el protocolo; en otro caso, 0.</p><p style="margin-top:12px">Las notas de hechos y solicitud otorgan 5 puntos cada una al alcanzar 25 y 15 caracteres respectivamente. La aplicación comprueba la extensión; <b>el docente debe valorar su precisión y pertinencia</b>. No hay evaluación semántica automática.</p><p style="margin-top:12px">Porcentaje = puntos obtenidos ÷ 1.000 × 100. Nota en escala de 1 a 5 = porcentaje ÷ 20, con mínimo 1,00 y dos decimales sin redondeo hacia arriba. Se aprueba desde 60% (3,00), incluido. El tiempo no afecta la nota y cada caso se evalúa una sola vez por jornada.</p></section><section class="panel manual-card"><h3>Tu información en esta práctica</h3><p style="margin-top:10px">El avance se guarda únicamente en este navegador cuando el almacenamiento está disponible. No se sincroniza entre equipos. Descargar el PDF permite entregar los resultados. No ingreses datos reales de clientes.</p></section></div></div>${gradeLegend()}`;}
function openModal(html,afterOpen){lastFocus=document.activeElement;$('#modal-content').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();if(afterOpen)afterOpen();}
function modalHead(title){return `<div class="dialog-head"><h2 id="modal-title" style="font-size:22px">${title}</h2><button class="icon-btn" data-close aria-label="Cerrar ventana">${icon('close')}</button></div>`;}
function closeModal(){if($('#modal').open)$('#modal').close();if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});}
function openWelcome(enter=false){if(!state.mode){goModes();return;}enteringMode=enter===true;const continuing=state.student.name&&state.results.length>0;openModal(`${modalHead(enteringMode?'Antes de abrir el mostrador':'Datos del estudiante')}<div class="dialog-body"><div class="eyebrow">${modeConfig().label.toUpperCase()} · ${modeConfig().count} CLIENTES</div><h2 id="profile-title">${continuing?'Tu jornada te espera.':'Cada persona cuenta.'}</h2><p>${modeConfig().description}</p>${continuing?`<div class="callout">${icon('folder')}<span>Hay ${state.results.length} de ${modeConfig().count} casos guardados en este modo. Continuarás desde tu último avance.</span></div>`:''}<form id="student-form"><div class="form-row"><div class="field"><label for="student-name">Tu nombre *</label><input class="input" id="student-name" name="studentName" required minlength="2" maxlength="80" autocomplete="name" placeholder="Nombre del estudiante" value="${esc(state.student.name)}"></div><div class="field"><label for="student-group">Curso o grupo *</label><input class="input" id="student-group" name="studentGroup" required minlength="2" maxlength="80" placeholder="Ej. Administrativo 01" value="${esc(state.student.group)}"></div></div><button class="button" type="submit" style="width:100%">${enteringMode?(continuing?'Continuar mi jornada':'Comenzar mi jornada'):'Guardar mis datos'}${icon('arrow')}</button></form><p class="tiny-note">${isGuided()?'Puedes abrir pistas y conversar con tu docente en cada caso.':'Sin pistas. La calificación y el PDF se habilitan al completar los 15 clientes.'} Se aprueba desde 3,00 sobre 5.</p></div>`,()=>$('#student-name').focus());}

function openHelp(){openModal(`${modalHead('Cómo jugar')}<div class="dialog-body"><div class="eyebrow">${modeConfig().label.toUpperCase()}</div><ol class="protocol-list"><li>Lee la conversación y revisa los documentos del cliente.</li><li>Elige una respuesta en cada uno de los tres momentos.</li><li>Completa las tres secciones del CRM y radica el expediente.</li><li>Continúa hasta atender los ${modeConfig().count} clientes de tu modo.</li></ol><p>En celular alterna entre Atender cliente y Gestionar en CRM. En computador puedes usar 1, 2 y 3 para responder.</p><p>${isGuided()?'Usa las pistas de conversación y del CRM. Consultarlas no resta puntos.':'La práctica no contiene pistas ni correcciones durante el recorrido. Al finalizar podrás ver la evaluación y descargar tu PDF.'}</p><button class="button" data-close style="width:100%">Entendido</button></div>`);}

function openDocument(id){const c=currentCase(),doc=c?.docs.find(d=>d.id===id);if(!doc)return;if(!state.readDocs.includes(id))state.readDocs.push(id);save();const b=$('[data-document="'+id+'"]');if(b)b.classList.add('read');openModal(`${modalHead('Documento del cliente')}<div class="dialog-body"><div class="paper-doc"><div class="eyebrow">${esc(doc.kind)} · ${c.ref}</div><h3>${esc(doc.name)}</h3><p>${esc(doc.text)}</p><span class="doc-stamp">COPIA DE SIMULACIÓN</span></div><p>Después de revisarlo, decide si aporta evidencia pertinente. Vincula los soportes en la sección Gestión del CRM.</p><button class="button secondary" data-close style="width:100%">${icon('check')}Documento revisado</button></div>`);}
function openDossier(){const c=currentCase();if(!c)return;openModal(`${modalHead('Ficha del cliente')}<div class="dialog-body"><div style="display:flex;align-items:center;gap:14px"><div class="customer-avatar" style="width:56px;height:56px">${portrait(c,true)}</div><div><h3 style="font-size:20px;font-family:Georgia,serif">${esc(c.name)}</h3><span class="muted small">${esc(c.role)}</span></div></div><dl class="data-summary"><dt>Contacto confirmado para esta práctica</dt><dd style="font-size:15px;overflow-wrap:anywhere">${esc(c.email)}</dd><dt>Referencia</dt><dd>${c.ref}</dd><dt>Hechos disponibles</dt><dd>${esc(c.facts)}</dd></dl><p class="tiny-note">Personaje y datos ficticios. Usa esta información para redactar tus propias notas.</p><button class="button secondary" data-close style="width:100%">Volver al caso${icon('arrow')}</button></div>`);}
function openNotebook(){openModal(`${modalHead('Mi libreta de atención')}<div class="dialog-body"><p>Apunta referencias, dudas o compromisos. Esta libreta es de apoyo y no tiene puntuación.</p><label class="field-label" for="notebook-input">Tus notas del caso ${currentCase()?.id||''}</label><textarea id="notebook-input" class="large" maxlength="1500" ${currentResult()?'readonly':''} placeholder="Lo que no quiero olvidar…">${esc(state.draft.notebook)}</textarea><p class="tiny-note">${currentResult()?'Las notas de este caso ya radicado se conservan en el expediente.':'Se guarda automáticamente. Redacta los hechos y la solicitud en el CRM para evaluarlos.'}</p><button class="button secondary" data-close style="width:100%">Cerrar libreta</button></div>`);}
function openProtocol(){if(!isGuided())return;const c=currentCase();openModal(`${modalHead('Pistas del CRM')}<div class="dialog-body"><div class="eyebrow">REGLAS DIDÁCTICAS · ${c?.id||''}</div><h3>${esc(c?.title||'Atención al cliente')}</h3><p><b>Clasificación orientativa:</b> ${esc(c?.type||'')}.</p><p>${esc(c?.policy||'Consulta el manual de atención.')}</p><div class="callout">${icon('info')}<span>El plazo corresponde al seguimiento acordado dentro de la simulación. No es una garantía de solución ni un término legal.</span></div><p>Verifica el contacto, conserva solo soportes pertinentes y registra los hechos sin atribuir responsabilidades no comprobadas.</p><button class="button secondary" data-close style="width:100%">Aplicar al expediente${icon('arrow')}</button></div>`);}
function resultChecks(r){return `<div class="check-results"><h3 style="margin:10px 0">Conversación · ${r.dialogueScore} / 30</h3>${r.dialogue.map(d=>`<div class="check-result"><strong>${d.label}</strong><b class="${d.earned===d.max?'earned':'missed'}">${d.earned} / ${d.max}</b><p>${esc(d.feedback)}${d.earned<d.max?`<br><b>Una mejor respuesta:</b> ${esc(d.expected)}`:''}</p></div>`).join('')}<h3 style="margin:20px 0 10px">Gestión en CRM · ${r.crm} / 70</h3>${r.checks.map(check=>`<div class="check-result"><strong>${check.earned?'✓':'○'} ${check.label}</strong><b class="${check.earned?'earned':'missed'}">${check.earned} / ${check.max}</b><p>${check.earned?'Criterio cumplido.':'Para este caso: '+esc(check.expected)}</p></div>`).join('')}</div>`;}
function openResult(id,next=false){if(!resultsVisible())return;const r=state.results.find(r=>r.id===id),c=CASES.find(c=>c.id===id);if(!r||!c)return;const band=gradeBand(r.total);openModal(`${modalHead('Caso evaluado · '+id)}<div class="dialog-body"><div class="result-hero"><div class="score-circle" style="--score:${r.total};${r.total<60?'--green:#ad6251':''}"><div><strong>${r.total}%</strong><span>${r.total} / 100 puntos</span></div></div><span class="grade ${band.className}">${band.label}</span><h2 style="font-size:25px;margin-top:14px">${esc(c.title)}</h2><p>${esc(c.name)} · Radicado PE-${c.id}</p></div><p class="feedback-note">${r.total>=90?'Escuchaste y seguiste una ruta consistente. Revisa tus notas con el docente para profundizar.':r.total>=60?'Has alcanzado el mínimo aprobatorio del caso. Revisa los criterios pendientes para mejorar tu siguiente atención.':'Revisa las decisiones y el protocolo. Cada criterio te muestra qué ajustar en una próxima práctica.'}</p>${resultChecks(r)}<p class="tiny-note">Los puntos de las notas verifican extensión. El docente evalúa la calidad de su contenido.</p></div><div class="result-actions"><button class="button" ${next?'data-action="next-case"':'data-close'}>${next?(finalCase()?'Ver resultado final':'Llamar al siguiente cliente'):'Cerrar evaluación'}${icon('arrow')}</button></div>`);}
function openRecord(id){const r=state.results.find(r=>r.id===id),c=CASES.find(c=>c.id===id);if(!r||!c)return;openModal(`${modalHead('Expediente PE-'+id)}<div class="dialog-body"><div class="eyebrow">${esc(c.title)}</div>${resultsVisible()?`<span class="grade ${gradeBand(r.total).className}">${r.total}% · ${gradeBand(r.total).label}</span>`:'<span class="badge blue">REGISTRADO</span>'}${recordSummary(r,c)}${r.draft.notebook?`<dl class="data-summary"><dt>Libreta del estudiante</dt><dd>${esc(r.draft.notebook)}</dd></dl>`:''}<h3 style="margin-top:20px">Historial de la gestión simulada</h3><ol class="protocol-list"><li>Atención y tres decisiones de diálogo completadas.</li><li>Expediente PE-${id} radicado el ${esc(dateText(r.timestamp))}.</li><li>Asignación registrada: ${esc(r.draft.area)}.</li><li>Estado registrado: ${esc(r.draft.status)}. Seguimiento: ${esc(r.draft.deadline)}.</li></ol><p class="tiny-note">Este historial conserva las decisiones del estudiante, incluidas las que requieran corrección.</p>${resultsVisible()?`<button class="button secondary" data-review="${id}" style="width:100%">${icon('chart')}Revisar evaluación</button>`:''}</div>`);}
function confirmRestart(){openModal(`${modalHead('Comenzar una nueva jornada')}<div class="dialog-body"><p>La nueva jornada reemplazará solamente el avance de ${modeConfig().label}. El otro modo conserva su sesión. ${exportAvailable()?'Descarga el informe antes de reiniciar.':isGuided()?'Todavía no hay expedientes evaluados.':'La práctica incompleta no genera PDF.'}</p><div class="button-row"><button class="button secondary" data-action="export" ${!exportAvailable()?'disabled':''}>${icon('download')}Descargar PDF</button><button class="button danger" data-action="confirm-restart">Reiniciar jornada</button><button class="button ghost" data-close>Continuar mi jornada</button></div></div>`);}
function exportPDF(){if(!exportAvailable()){toast(isGuided()?'Radica al menos un caso para descargar el informe.':'Completa los 15 clientes para descargar tu resultado.');return;}try{const bytes=buildReportPDF(state),blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Punto-de-Encuentro_${state.mode}_${state.results.length===modeConfig().count?'resultado':'parcial'}_${normalize(state.student.name).replace(/[^a-z0-9]+/g,'-').slice(0,50)||'estudiante'}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Informe PDF generado. Revisa las descargas de tu navegador.');}catch(e){console.error(e);toast('No se pudo generar el PDF. Tu avance sigue guardado; vuelve a intentarlo.');}}
document.addEventListener('click',event=>{
 const el=event.target.closest('button');if(!el||el.disabled)return;
 if(el.dataset.mode){selectMode(el.dataset.mode);return;}
 if(el.hasAttribute('data-close')){closeModal();return;}
 if(el.dataset.view){goView(el.dataset.view);return;}
 if(el.dataset.pane){setPane(el.dataset.pane);return;}
 if(el.dataset.crmTab!==undefined){setCRMTab(Number(el.dataset.crmTab));return;}
 if(el.dataset.choice!==undefined){choose(Number(el.dataset.choice));return;}
 if(el.dataset.document){openDocument(el.dataset.document);return;}
 if(el.dataset.review){openResult(el.dataset.review);return;}
 if(el.dataset.record){openRecord(el.dataset.record);return;}
 const actions={'next-dialogue':nextDialogue,'next-case':nextCase,dossier:openDossier,notebook:openNotebook,protocol:openProtocol,profile:openWelcome,modes:goModes,export:exportPDF,restart:confirmRestart,'confirm-restart':()=>{closeModal();state=blankState(state.mode);view='modes';crmTab=0;mobilePane='desk';save();render();openWelcome(true);}};
 if(actions[el.dataset.action])actions[el.dataset.action]();
});
document.addEventListener('submit',e=>{if(e.target.id==='crm-form'){e.preventDefault();submitCRM();}if(e.target.id==='student-form'){e.preventDefault();for(const id of ['student-name','student-group']){const field=$('#'+id);if(field.value.trim().length<2){field.setCustomValidity('Escribe al menos dos caracteres.');field.reportValidity();return;}}const start=enteringMode;state.student={name:$('#student-name').value.trim(),group:$('#student-group').value.trim()};save();closeModal();enteringMode=false;if(start)view=state.index===modeConfig().count?'progress':'desk';render();window.scrollTo(0,0);if(start)animateModeEntry();else toast('Datos actualizados.');}});

document.addEventListener('input',e=>{
 if(['student-name','student-group'].includes(e.target.id))e.target.setCustomValidity('');
 if(e.target.id==='notebook-input'&&!currentResult()){state.draft.notebook=e.target.value;save();return;}
 if(e.target.closest('#crm-form')&&e.target.name&&e.target.name!=='evidence'){state.draft[e.target.name]=e.target.value;if(e.target.name==='action'){const preview=$('#action-preview');if(preview){preview.textContent=e.target.value;preview.hidden=!e.target.value;}}save();}
 if(e.target.id==='record-search')$('#records-list').innerHTML=recordCards(e.target.value,$('#record-filter').value);
});
document.addEventListener('change',e=>{if(e.target.name==='evidence'){state.draft.evidence=[...document.querySelectorAll('[name="evidence"]:checked')].map(el=>el.value);save();}if(e.target.closest('#crm-form')&&e.target.name&&e.target.name!=='evidence'){state.draft[e.target.name]=e.target.value;if(e.target.name==='action'){const preview=$('#action-preview');if(preview){preview.textContent=e.target.value;preview.hidden=!e.target.value;}}save();}if(e.target.id==='record-filter')$('#records-list').innerHTML=recordCards($('#record-search').value,e.target.value);});
document.addEventListener('keydown',e=>{if(e.target.matches('[role="tab"][data-crm-tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();setCRMTab(e.key==='Home'?0:e.key==='End'?2:(crmTab+(e.key==='ArrowRight'?1:2))%3);return;}if(e.repeat||e.ctrlKey||e.altKey||e.metaKey||$('#modal').open||view!=='desk'||(innerWidth<=740&&mobilePane!=='desk')||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(['1','2','3'].includes(e.key)){const choice=document.querySelectorAll('.choice')[Number(e.key)-1];if(choice&&!choice.disabled){e.preventDefault();choice.click();}}});
$('#sound-button').addEventListener('click',()=>{state.sound=!state.sound;save();$('#sound-button').innerHTML=icon(state.sound?'volume':'mute');$('#sound-button').setAttribute('aria-pressed',String(state.sound));$('#sound-button').setAttribute('aria-label',state.sound?'Desactivar sonido':'Activar sonido');sound();toast(state.sound?'Sonido activado':'Sonido desactivado');});
$('#profile-button').addEventListener('click',openWelcome);$('#mobile-profile').addEventListener('click',openWelcome);$('#help-button').addEventListener('click',openHelp);
$('#modal').addEventListener('cancel',()=>{enteringMode=false;});
$('#modal').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});});
window.addEventListener('storage',e=>{if(state.mode&&e.key===storageKey())toast('La jornada cambió en otra pestaña. Recarga para ver su versión guardada.');});
render();
</script>
</body>
</html>
